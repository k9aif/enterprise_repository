<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K9X Enterprise Repository</title>
  <!-- ?v=N is a manual cache-buster, same convention as doit/index.html
       (?v=25) -- bump N here on every real app.css/app.js change. A
       version-bumped URL is treated as a brand-new resource by any cache
       layer (browser or Cloudflare), so it doesn't wait on a revalidation
       round-trip the way NoCacheStaticFiles' no-cache header does --
       both together mean a real deploy is never invisible for hours
       again (confirmed live 2026-09-22: exactly that happened once
       already, Cloudflare serving a stale app.js under its own
       max-age=14400 default). -->
  <link rel="stylesheet" href="/static/app.css?v=1">
</head>
<body>
  <div class="layout" id="layout">
    <aside class="sidebar">
      <div style="font-size:13px;font-weight:700;color:var(--text-header);margin-bottom:2px">
        <a href="https://k9x.ai" target="_blank" rel="noopener" class="header-logo" style="font-size:15px">K9X</a> Enterprise Repository <span class="beta-badge">Beta</span>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">Architecture Repository</div>

      <a href="#/" class="sidebar-home-link">← Home</a>

      <a href="#/browse" class="btn btn-primary" style="display:block;text-align:center;margin-bottom:16px">Browse</a>

      <h3>Artifact Types</h3>
      <ul id="nav-artifact-types"><li class="muted">loading…</li></ul>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-brand">
          <a class="header-logo" href="https://k9x.ai" target="_blank" rel="noopener">K9X</a>
          <div class="header-sub">Enterprise Repository <span class="beta-badge">Beta</span></div>
        </div>
        <form class="site-search" id="site-search">
          <input type="text" id="q" placeholder="Search artifacts, standards, patterns…" autocomplete="off">
          <button type="submit">Search</button>
        </form>
        <div class="header-actions">
          <a id="continuum-link" class="btn btn-ghost" href="#" target="_blank" style="padding:6px 12px;font-size:12px">Open Continuum ↗</a>
          <button id="theme-btn" class="theme-toggle" title="Toggle theme">🌙</button>
        </div>
      </header>

      <div class="content">
        <main id="app">Loading…</main>
      </div>

      <footer class="site-footer">
        K9X Enterprise Repository — the Architecture Repository behind
        <a id="continuum-footer-link" href="#" target="_blank">K9X Continuum</a>'s Enterprise Continuum catalog.
      </footer>
    </div>
  </div>

  <script src="/static/app.js?v=1"></script>
</body>
</html>
